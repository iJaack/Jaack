<svg class="forma-diagram__desktop" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="tgt-en-d-title tgt-en-d-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="tgt-en-d-title">An example day, 2,400 kcal</title>
  <desc id="tgt-en-d-desc">A synthetic example: 2,400 kcal from Apple Health energy expenditure, split into 150 g of protein (600 kcal, you set this), fat at 25% (67 g, 600 kcal, within the 25-30% range) and carbs for the remainder (300 g, 1,200 kcal). Fiber is a separate 30 g target. This is not advice, and these are not real targets.</desc>
  <defs>
    <marker id="tgt-en-d-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="tgt-en-d-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="tgt-en-d-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="tgt-en-d-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="80" fill="var(--jk-ink)" font-size="32" font-weight="600">An example day, 2,400 kcal</text>
  <rect x="1400" y="80" width="136" height="44" rx="12" ry="12" fill="none" stroke="var(--jk-accent)" stroke-width="3"/>
  <text x="1468.0" y="110.4" fill="var(--jk-accent)" font-size="24" font-weight="600" text-anchor="middle">EXAMPLE</text>
  <rect x="64" y="240" width="1472" height="96" rx="12" ry="12" fill="none" stroke="var(--jk-hair-2)" stroke-width="2"/>
  <clipPath id="tgt-en-d-bar"><rect x="64" y="240" width="1472" height="96" rx="12" ry="12"/></clipPath>
  <g clip-path="url(#tgt-en-d-bar)">
    <rect x="64" y="240" width="368.0" height="96" fill="var(--jk-accent)"/>
    <rect x="432.0" y="240" width="368.0" height="96" fill="url(#tgt-en-d-hatch-acc)"/>
    <line x1="432.0" y1="240" x2="432.0" y2="336" stroke="var(--jk-hair)" stroke-width="2"/>
    <line x1="800.0" y1="240" x2="800.0" y2="336" stroke="var(--jk-hair)" stroke-width="2"/>
  </g>
  <text x="248.0" y="384" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="248.0" dy="0">Protein, 150 g</tspan></text>
  <text x="248.0" y="420" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="248.0" dy="0">600 kcal · you set this</tspan></text>
  <text x="616.0" y="384" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="616.0" dy="0">Fat, 67 g</tspan></text>
  <text x="616.0" y="420" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="616.0" dy="0">600 kcal · 25%, within 25-30%</tspan></text>
  <text x="1168.0" y="384" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1168.0" dy="0">Carbs, 300 g</tspan></text>
  <text x="1168.0" y="420" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1168.0" dy="0">1,200 kcal · the remainder</tspan></text>
  <text x="64" y="216" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="start"><tspan x="64" dy="0">2,400 kcal  ·  Apple Health energy expenditure</tspan></text>
  <rect x="64" y="512" width="1472" height="80" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="800" y="562" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">Fiber: 30 g, a separate target, not a slice of the calories</tspan></text>
</svg>
