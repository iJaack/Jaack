<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" aria-labelledby="meal-it-d-title meal-it-d-desc" class="forma-diagram__desktop" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 1600 560"><title id="meal-it-d-title">Registrare un pasto</title><desc id="meal-it-d-desc">Mandi una foto, un menu o una descrizione. Forma stima calorie, macro e fibre e marca la stima come tale, la scrive nel diario e la dashboard si aggiorna. Se correggi il pasto, aggiorna la stessa voce, senza crearne una seconda.</desc><defs><marker id="meal-it-d-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="meal-it-d-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="meal-it-d-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="meal-it-d-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="80" fill="var(--jk-ink)" font-size="32" font-weight="600">Registrare un pasto</text><rect width="248" height="280" x="64" y="168" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="188" y="287.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="188" dy="0">Mandi una foto,</tspan><tspan x="188" dy="30">un menu o una</tspan><tspan x="188" dy="30">descrizione</tspan></text><line x1="312" x2="364" y1="308" y2="308" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-d-arrow)"/><rect width="248" height="280" x="368" y="168" fill="none" stroke="var(--jk-accent)" stroke-width="3" rx="12" ry="12"/><text x="492" y="283.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="492" dy="0">Forma stima kcal,</tspan><tspan x="492" dy="30">macro e fibre</tspan></text><text x="492" y="342" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="492" dy="0">marcata come stima</tspan></text><line x1="616" x2="668" y1="308" y2="308" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-d-arrow)"/><rect width="248" height="280" x="672" y="168" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="796" y="317.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="796" dy="0">Scrive nel diario</tspan></text><line x1="920" x2="972" y1="308" y2="308" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-d-arrow)"/><rect width="248" height="280" x="976" y="168" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="1100" y="302.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1100" dy="0">La dashboard</tspan><tspan x="1100" dy="30">si aggiorna</tspan></text><line x1="1224" x2="1276" y1="308" y2="308" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-d-arrow)"/><rect width="248" height="280" x="1280" y="168" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="1404" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1404" dy="0">Se correggi,</tspan><tspan x="1404" dy="30">aggiorna la</tspan><tspan x="1404" dy="30">stessa voce</tspan></text><text x="1404" y="357" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1404" dy="0">niente duplicati</tspan></text></svg>