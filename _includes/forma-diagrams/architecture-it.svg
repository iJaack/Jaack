  <text x="1408.0" y="466.99999999999994" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1408.0" dy="0">protetta da password</tspan></text>
  <line x1="320" y1="288.0" x2="364" y2="288.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-it-d-arrow)"/>
