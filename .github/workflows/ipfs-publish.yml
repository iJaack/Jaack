name: Publish IPFS archive
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jaack-me-ipfs-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@44511735964dcb71245e7e55f72539531f7bc0eb # v1.257.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          bundle exec jekyll build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Test and validate IPFS copy
        run: |
          set -euo pipefail
          node --test tests/ipfs-gateway.test.cjs tests/ipfs-publish.test.cjs
          node scripts/ipfs/gateway-safe.mjs
          node scripts/ipfs/check.mjs
      - name: Create CID and CAR
        id: car
        run: |
          set -euo pipefail
          scripts/ipfs/prepare-car.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jaack-me-${{ steps.car.outputs.cid }}
          path: ${{ steps.car.outputs.car }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Pin and update DNSLink when configured
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
          FILEBASE_BUCKET: ${{ secrets.FILEBASE_BUCKET }}
          CLOUDFLARE_DNSLINK_TOKEN: ${{ secrets.CLOUDFLARE_DNSLINK_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          IPFS_DNSLINK_NAME: ${{ vars.IPFS_DNSLINK_NAME }}
          IPFS_CID: ${{ steps.car.outputs.cid }}
          IPFS_CAR: ${{ steps.car.outputs.car }}
        run: |
          set -euo pipefail
          node scripts/ipfs/publish.mjs "$IPFS_CID" "$IPFS_CAR"
