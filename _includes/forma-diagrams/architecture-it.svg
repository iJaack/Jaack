<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-labelledby="arch-it-d-title arch-it-d-desc" class="forma-diagram__desktop" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 1600 900"><title id="arch-it-d-title">Come arrivano i dati</title><desc id="arch-it-d-desc">Tu parli con il bot Forma in Grok Bot, che invia i pasti a un Worker Cloudflare con D1. Forma Sync invia i dati di Apple Health allo stesso Worker. La dashboard, protetta da password, li legge da lì. Calendario ed email, se collegati, arrivano al bot in sola lettura.</desc><defs><marker id="arch-it-d-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="arch-it-d-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="arch-it-d-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="arch-it-d-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="112" fill="var(--jk-ink)" font-size="32" font-weight="600">Come arrivano i dati</text><rect width="256" height="160" x="64" y="208" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="192" y="278.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="192" dy="0">Tu, in chat</tspan></text><text x="192" y="307" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="192" dy="0">foto, menu o testo</tspan></text><rect width="256" height="160" x="368" y="208" fill="none" stroke="var(--jk-hair)" stroke-width="2"