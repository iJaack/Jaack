    <marker id="arch-it-d-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="arch-it-d-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="arch-it-d-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="arch-it-d-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="112" fill="var(--jk-ink)" font-size="32" font-weight="600">Come arrivano i dati</text>
  <rect x="64" y="208" width="256" height="160" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="192.0" y="248.60000000000002" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="192.0" dy="0">Tu, in chat</tspan></text>
  <text x="192.0" y="277.0" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="192.0" dy="0">foto, menu o testo</tspan></text>
  <rect x="368" y="208" width="256" height="160" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="496.0" y="248.60000000000002" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="496.0" dy="0">Bot Forma</tspan></text>
  <text x="496.0" y="277.0" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="496.0" dy="0">in Grok Bot</tspan><tspan x="496.0" dy="30">calendario ed email:</tspan><tspan x="496.0" dy="30">sola lettura</tspan></text>
  <rect x="64" y="536" width="256" height="160" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="192.0" y="606.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="192.0" dy="0">iPhone</tspan></text>
  <text x="192.0" y="635.0" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="192.0" dy="0">Apple Health</tspan></text>
  <rect x="368" y="536" width="256" height="160" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="496.0" y="606.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="496.0" dy="0">Forma Sync</tspan></text>
