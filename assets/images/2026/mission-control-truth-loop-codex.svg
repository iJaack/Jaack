<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mission Control truth loop</title>
  <desc id="desc">A light theme process diagram for the Mission Control truth loop that compares runtime truth against dashboard claims and degrades stale confidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#f0ede4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#666257"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="120" y="118" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700">Mission Control truth loop</text>
  <text x="120" y="163" fill="#625d53" font-family="Helvetica, Arial, sans-serif" font-size="24">Protect the dashboard from becoming painted reality.</text>

  <rect x="120" y="260" width="230" height="132" rx="24" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2"/>
  <text x="235" y="315" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Observe truth</text>
  <text x="235" y="350" text-anchor="middle" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18">app + runtime state</text>

  <rect x="404" y="260" width="230" height="132" rx="24" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2"/>
  <text x="519" y="315" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Compare claims</text>
  <text x="519" y="350" text-anchor="middle" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18">dashboard + API assertions</text>

  <rect x="688" y="260" width="230" height="132" rx="24" fill="#fff8ef" stroke="#e2b16f" stroke-width="2"/>
  <text x="803" y="315" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Degrade or fix</text>
  <text x="803" y="350" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18">stale state loses certainty</text>

  <rect x="972" y="260" width="230" height="132" rx="24" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2"/>
  <text x="1087" y="315" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Run gates</text>
  <text x="1087" y="350" text-anchor="middle" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="18">route, API, verifier checks</text>

  <rect x="1256" y="260" width="230" height="132" rx="24" fill="#fff3f1" stroke="#d78f83" stroke-width="2"/>
  <text x="1371" y="315" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Report truth</text>
  <text x="1371" y="350" text-anchor="middle" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="18">actionable state only</text>

  <path d="M350 326H404" fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M634 326H688" fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M918 326H972" fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1202 326H1256" fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="120" y="495" width="1366" height="244" rx="28" fill="#ffffff" stroke="#d8d3c7" stroke-width="2"/>
  <text x="170" y="558" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Contract</text>
  <text x="170" y="610" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Observe app and runtime truth -> compare dashboard claims -> degrade stale state or prepare fix -> run gates -> update loop state.</text>
  <text x="170" y="661" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">A green page is not proof. A route loading is not enough. A passing API is not enough.</text>
  <text x="170" y="712" fill="#8a4c42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">If the system overstates reality, every downstream decision inherits the lie.</text>
</svg>
