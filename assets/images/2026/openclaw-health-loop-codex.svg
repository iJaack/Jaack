<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw health loop</title>
  <desc id="desc">A light theme process diagram for the OpenClaw health loop from runtime observation to loop state update.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#f1efe8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6b685f"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="120" y="120" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700">OpenClaw health loop</text>
  <text x="120" y="165" fill="#625d53" font-family="Helvetica, Arial, sans-serif" font-size="24">Honest runtime health: detect, classify, repair when safe, and record state without freestyling.</text>

  <rect x="120" y="270" width="210" height="130" rx="24" fill="#fff8ef" stroke="#e2b16f" stroke-width="2"/>
  <text x="225" y="325" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Observe</text>
  <text x="225" y="360" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18">runtime + listeners</text>

  <rect x="392" y="270" width="210" height="130" rx="24" fill="#fff8ef" stroke="#e2b16f" stroke-width="2"/>
  <text x="497" y="325" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Classify</text>
  <text x="497" y="360" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18">healthy / degraded / broken</text>

  <rect x="664" y="270" width="210" height="130" rx="24" fill="#f7fbff" stroke="#7ea3dd" stroke-width="2"/>
  <text x="769" y="325" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Repair or degrade</text>
  <text x="769" y="360" text-anchor="middle" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18">only safe, reversible actions</text>

  <rect x="936" y="270" width="210" height="130" rx="24" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2"/>
  <text x="1041" y="325" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Verify</text>
  <text x="1041" y="360" text-anchor="middle" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="18">route, log, auth, cron truth</text>

  <rect x="1208" y="270" width="210" height="130" rx="24" fill="#fff3f1" stroke="#d78f83" stroke-width="2"/>
  <text x="1313" y="325" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Update state</text>
  <text x="1313" y="360" text-anchor="middle" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="18">status + next action</text>

  <path d="M330 335H392" fill="none" stroke="#6b685f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M602 335H664" fill="none" stroke="#6b685f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M874 335H936" fill="none" stroke="#6b685f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1146 335H1208" fill="none" stroke="#6b685f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="120" y="505" width="1298" height="220" rx="28" fill="#ffffff" stroke="#d8d3c7" stroke-width="2"/>
  <text x="165" y="565" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Checks</text>
  <text x="165" y="615" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Gateway health, auth profile routing, Telegram delivery path, cron freshness, session state, listeners, and log quality.</text>
  <text x="165" y="666" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Rule: the loop may repair only when the fix is known, reversible, and explicitly allowed.</text>
  <text x="165" y="705" fill="#8a4c42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">No surprise reauth. No broad config migration. No pretending risk is autonomy.</text>
</svg>
