<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-labelledby="meal-it-m-title meal-it-m-desc" class="forma-diagram__mobile" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 800 1000"><title id="meal-it-m-title">Registrare un pasto</title><desc id="meal-it-m-desc">Mandi una foto, un menu o una descrizione. Forma stima calorie, macro e fibre e marca la stima come tale, la scrive nel diario e la dashboard si aggiorna. Se correggi il pasto, aggiorna la stessa voce, senza crearne una seconda.</desc><defs><marker id="meal-it-m-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="meal-it-m-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="meal-it-m-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="meal-it-m-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">Registrare un pasto</text><rect width="672" height="124" x="64" y="136" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="400" y="174.2" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">Mandi una foto,</tspan><tspan x="400" dy="35">un menu o una</tspan><tspan x="400" dy="35">descrizione</tspan></text><rect width="672" height="132" x="64" y="306" fill="none" stroke="var(--jk-accent)" stroke-width="3" rx="12" ry="12"/><text x="400" y="344.2" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">Forma stima kcal,</tspan><tspan x="400" dy="35">macro e fibre</tspan></text><text x="400" y="411" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">marcata come stima</tspan></text><rect width="672" height="112" x="64" y="484" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="400" y="551.2" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">Scrive nel diario</tspan></text><rect width="672" height="112" x="64" y="642" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="400" y="691.7" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">La dashboard</tspan><tspan x="400" dy="35">si aggiorna</tspan></text><rect width="672" height="167" x="64" y="800" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="400" y="838.2" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">Se correggi,</tspan><tspan x="400" dy="35">aggiorna la</tspan><tspan x="400" dy="35">stessa voce</tspan></text><text x="400" y="940" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">niente duplicati</tspan></text><line x1="400" x2="400" y1="260" y2="302" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-m-arrow)"/><line x1="400" x2="400" y1="438" y2="480" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-m-arrow)"/><line x1="400" x2="400" y1="596" y2="638" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-m-arrow)"/><line x1="400" x2="400" y1="754" y2="796" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-m-arrow)"/></svg>