<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">Mission Control truth loop</title><desc id="desc">A light theme process diagram for the Mission Control truth loop that compares runtime truth against dashboard claims and degrades stale confidence.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fbfaf6"/><stop offset="100%" stop-color="#f0ede4"/></linearGradient><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#666257" d="M0 0L10 5L0 10Z"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="120" y="118" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700">Mission Control truth loop</text><text x="120" y="163" fill="#625d53" font-family="Helvetica, Arial, sans-serif" font-size="24">Protect the dashboard from becoming painted reality.</text><rect width="230" height="132" x="120" y="260" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2" rx="24"/><text x="235" y="315" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Observe truth</text><text x="235" y="350" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">app + runtime state</text><rect width="230" height="132" x="404" y="260" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2" rx="24"/><text x="519" y="315" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Compare claims</text><text x="519" y="350" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">dashboard + API assertions</text><rect width="230" height="132" x="688" y="260" fill="#fff8ef" stroke="#e2b16f" stroke-width="2" rx="24"/><text x="803" y="315" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Degrade or fix</text><text x="803" y="350" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">stale state loses certainty</text><rect width="230" height="132" x="972" y="260" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2" rx="24"/><text x="1087" y="315" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Run gates</text><text x="1087" y="350" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">route, API, verifier checks</text><rect width="230" height="132" x="1256" y="260" fill="#fff3f1" stroke="#d78f83" stroke-width="2" rx="24"/><text x="1371" y="315" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Report truth</text><text x="1371" y="350" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">actionable state only</text><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M350 326H404"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M634 326H688"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M918 326H972"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M1202 326H1256"/><rect width="1366" height="244" x="120" y="495" fill="#fff" stroke="#d8d3c7" stroke-width="2" rx="28"/><text x="170" y="558" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Contract</text><text x="170" y="610" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Observe app and runtime truth -&gt; compare dashboard claims -&gt; degrade stale state or prepare fix -&gt; run gates -&gt; update loop state.</text><text x="170" y="661" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">A green page is not proof. A route loading is not enough. A passing API is not enough.</text><text x="170" y="712" fill="#8a4c42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">If the system overstates reality, every downstream decision inherits the lie.</text></svg>