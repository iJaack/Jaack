<svg class="forma-diagram__desktop" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="setup-it-d-title setup-it-d-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="setup-it-d-title">Mettere in piedi Forma</title>
  <desc id="setup-it-d-desc">I sei passi: installi il template del bot, fai la prima conversazione (dieci domande), metti in piedi la dashboard su Cloudflare, compili Forma Sync in Xcode, colleghi con INGEST_SECRET, fai la prima sincronizzazione.</desc>
  <defs>
    <marker id="setup-it-d-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="setup-it-d-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="setup-it-d-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="setup-it-d-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="80" fill="var(--jk-ink)" font-size="32" font-weight="600">Mettere in piedi Forma</text>
  <line x1="128" y1="260" x2="1408" y2="260" stroke="var(--jk-hair)" stroke-width="2"/>
  <circle cx="128" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="128" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">1</text>
  <text x="128" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="128" dy="0">Installi il</tspan><tspan x="128" dy="32">template del bot</tspan></text>
  <circle cx="384" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="384" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">2</text>
  <text x="384" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="384" dy="0">Prima conversazione</tspan><tspan x="384" dy="32">(10 domande)</tspan></text>
  <circle cx="640" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="640" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">3</text>
  <text x="640" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="640" dy="0">Metti in piedi la</tspan><tspan x="640" dy="32">dashboard su</tspan><tspan x="640" dy="32">Cloudflare</tspan></text>
  <circle cx="896" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="896" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">4</text>
  <text x="896" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="896" dy="0">Compili Forma Sync</tspan><tspan x="896" dy="32">in Xcode</tspan></text>
  <circle cx="1152" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="1152" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">5</text>
  <text x="1152" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1152" dy="0">Colleghi con</tspan><tspan x="1152" dy="32">INGEST_SECRET</tspan></text>
  <circle cx="1408" cy="260" r="24" fill="none" stroke="var(--jk-accent)" stroke-width="3"/>
  <text x="1408" y="268" fill="var(--jk-accent)" font-size="24" font-weight="600" text-anchor="middle">6</text>
  <text x="1408" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1408" dy="0">Prima</tspan><tspan x="1408" dy="32">sincronizzazione</tspan></text>
</svg>
