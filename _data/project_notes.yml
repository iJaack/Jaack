portfolio-os:
  en: "Start with the article on verification loops. It explains how I check agent outcomes and keep stale context from becoming an operational decision. This is my internal working system."
  it: "Parti dall’articolo sui cicli di verifica. Spiega come controllo i risultati degli agenti ed evito che un contesto superato diventi una decisione operativa. È il mio sistema di lavoro interno."
sea-temperature:
  en: "The important distinction is between a model estimate and a measurement at your exact location. My development work includes making coverage and unavailable data understandable on the map."
  it: "La distinzione importante è tra una stima del modello e una misura nella tua posizione esatta. Il lavoro di sviluppo comprende rendere leggibili sulla mappa la copertura e l’assenza di dati."
thicc:
  en: "Open the public interface to explore a token’s liquidity and the evidence behind its market snapshot. Treat modeled outcomes as estimates; an unavailable result is not a zero balance."
  it: "Apri l’interfaccia pubblica per esplorare la liquidità di un token e le evidenze dietro al mercato. I risultati simulati sono stime; un risultato non disponibile non è un saldo pari a zero."
gm10:
  en: "Explore the project’s card portfolio and public explanation of the strategy. The associated valuation essay is dated research: its assumptions describe the model at the time of writing."
  it: "Esplora il portafoglio di carte e la spiegazione pubblica della strategia. Il saggio sulla valutazione è una ricerca datata: le sue ipotesi descrivono il modello al momento della scrittura."
eva:
  en: "Eva Protocol is the concrete product within this broader initiative. Follow it to see how public theses, evidence, and revisions fit into the work on identity and distribution."
  it: "Eva Protocol è il prodotto concreto all’interno di questa iniziativa. Seguilo per capire come tesi pubbliche, evidenze e revisioni si inseriscano nel lavoro su identità e distribuzione."
eva-protocol:
  en: "Explore the public thesis platform. The product is about publishing reasoning and following evidence over time; it does not execute trades or hold user funds."
  it: "Esplora la piattaforma per le tesi pubbliche. Il prodotto riguarda la pubblicazione del ragionamento e l’evoluzione delle evidenze; non esegue operazioni di trading e non custodisce fondi degli utenti."
team1:
  en: "For a workshop, educational collaboration, or local Avalanche event, get in touch with a location and the audience you have in mind. My role is connecting the people and making the technical material useful."
  it: "Per un workshop, una collaborazione didattica o un evento locale su Avalanche, scrivimi indicando il luogo e il pubblico a cui pensi. Il mio ruolo è collegare le persone e rendere utile il materiale tecnico."
hundred:
  en: "Read the support page for the training plan and how the iPhone and Apple Watch experiences fit together. The goal is a progressive bodyweight routine with a clear workout history."
  it: "Leggi la pagina di supporto per il piano di allenamento e il collegamento tra iPhone e Apple Watch. L’obiettivo è una routine progressiva a corpo libero con uno storico chiaro degli allenamenti."
pommidoro:
  en: "The iPhone screen below shows the focus timer and session controls. Visit the product site for more information about the app; the preview here is a screenshot."
  it: "La schermata iPhone qui sotto mostra il timer e i controlli della sessione. Visita il sito del prodotto per maggiori informazioni sull’app; questa anteprima è uno screenshot."
parcelpilot:
  en: "The core experience brings delivery updates into one shipment list. I’m working on clear status, tracking history, and a consistent experience across Apple devices."
  it: "L’esperienza centrale riunisce gli aggiornamenti delle consegne in un solo elenco. Lavoro su stati comprensibili, storico del tracking e coerenza tra i dispositivi Apple."
redbridge:
  en: "My involvement is in token design and ecosystem advisory. For a conversation about token incentives or ecosystem positioning, contact me directly."
  it: "Il mio contributo riguarda il design del token e l’advisory sull’ecosistema. Per parlare di incentivi del token o di posizionamento nell’ecosistema, contattami direttamente."
acps:
  en: "Start with the fee-curve explorer: it lets you compare four validator-fee models and how their assumptions affect AVAX burn. The accompanying article explains the mechanics."
  it: "Parti dall’esploratore delle curve: permette di confrontare quattro modelli di commissioni per i validatori e l’effetto delle loro ipotesi sul burn di AVAX. L’articolo ne spiega i meccanismi."
routescan:
  en: "This is a previous role, ending in May 2026. The Routescan website is the destination for the company’s current product; my independent work is listed in the rest of this portfolio."
  it: "È un ruolo precedente, concluso a maggio 2026. Il sito di Routescan è il riferimento per il prodotto attuale dell’azienda; il mio lavoro indipendente è nel resto di questo portafoglio."
