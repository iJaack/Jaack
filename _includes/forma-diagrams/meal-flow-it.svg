<svg class="forma-diagram__desktop" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="meal-it-d-title meal-it-d-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="meal-it-d-title">Registrare un pasto</title>
  <desc id="meal-it-d-desc">Mandi una foto, un menu o una descrizione. Forma stima calorie, macro e fibre e marca la stima come tale, la scrive nel diario e la dashboard si aggiorna. Se correggi il pasto, aggiorna la stessa voce, senza crearne una seconda.</desc>
  <defs>
    <marker id="meal-it-d-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="meal-it-d-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="meal-it-d-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="meal-it-d-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="80" fill="var(--jk-ink)" font-size="32" font-weight="600">Registrare un pasto</text>
  <rect x="64" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="188.0" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="188.0" dy="0">Mandi una foto,</tspan><tspan x="188.0" dy="30">un menu o una</tspan><tspan x="188.0" dy="30">descrizione</tspan></text>
  <line x1="312" y1="308.0" x2="364" y2="308.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-d-arrow)"/>
  <rect x="368" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-accent)" stroke-width="3"/>
  <text x="492.0" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="492.0" dy="0">Forma stima kcal,</tspan><tspan x="492.0" dy="30">macro e fibre</tspan></text>
  <text x="492.0" y="327.0" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="492.0" dy="0">marcata come stima</tspan></text>
  <line x1="616" y1="308.0" x2="668" y2="308.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-d-arrow)"/>
  <rect x="672" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="796.0" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="796.0" dy="0">Scrive nel diario</tspan></text>
  <line x1="920" y1="308.0" x2="972" y2="308.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-d-arrow)"/>
  <rect x="976" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="1100.0" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1100.0" dy="0">La dashboard</tspan><tspan x="1100.0" dy="30">si aggiorna</tspan></text>
  <line x1="1224" y1="308.0" x2="1276" y2="308.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-it-d-arrow)"/>
  <rect x="1280" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="1404.0" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1404.0" dy="0">Se correggi,</tspan><tspan x="1404.0" dy="30">aggiorna la</tspan><tspan x="1404.0" dy="30">stessa voce</tspan></text>
  <text x="1404.0" y="357.0" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1404.0" dy="0">niente duplicati</tspan></text>
</svg>
