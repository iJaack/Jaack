h="2" marker-end="url(#arch-it-d-arrow)"/><text x="792" y="244" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="792" dy="0">POST /api/ingest/meals</tspan><tspan x="792" dy="28">bearer</tspan></text><line x1="1216" x2="1276" y1="448" y2="448" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-it-d-arrow)"/><line x1="320" x2="364" y1="616" y2="616" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-it-d-arrow)"/><line x1="624" x2="956" y1="616" y2="616" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-it-d-arrow)"/><text x="792" y="650" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="792" dy="0">POST /api/ingest/health</tspan><tspan x="792" dy="28">bearer</tspan></text></svg>