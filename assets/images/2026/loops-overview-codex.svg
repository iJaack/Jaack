<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">Three loops around the agent system core</title><desc id="desc">A light theme overview diagram showing Eva at the center with routing, health, truth, and forecast loops around it.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fbfaf6"/><stop offset="100%" stop-color="#f0ede4"/></linearGradient><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#686458" d="M0 0L10 5L0 10Z"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="110" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" text-anchor="middle">Three loops around the agent system core</text><text x="800" y="154" fill="#625d53" font-family="Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle">A small governance layer keeps ownership, runtime health, and visible truth aligned.</text><rect width="380" height="250" x="610" y="280" fill="#fff" stroke="#d8d3c7" stroke-width="2" rx="30"/><text x="800" y="354" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" text-anchor="middle">EVA</text><text x="800" y="393" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle">Kernel</text><text x="800" y="441" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle">Ops = control plane</text><text x="800" y="475" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle">Mission Control = UI</text><rect width="290" height="170" x="150" y="312" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2" rx="24"/><text x="295" y="370" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Routing</text><text x="295" y="407" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">Choose the correct owner</text><text x="295" y="437" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">before work begins</text><rect width="290" height="170" x="1160" y="312" fill="#fff8ef" stroke="#e2b16f" stroke-width="2" rx="24"/><text x="1305" y="370" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Health</text><text x="1305" y="407" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">Check runtime, listeners,</text><text x="1305" y="437" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">delivery paths, and logs</text><rect width="290" height="170" x="308" y="620" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2" rx="24"/><text x="453" y="678" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Truth</text><text x="453" y="715" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">Refuse painted dashboards</text><text x="453" y="745" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">and stale green states</text><rect width="290" height="170" x="1002" y="620" fill="#fff3f1" stroke="#d78f83" stroke-width="2" rx="24"/><text x="1147" y="678" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Forecast</text><text x="1147" y="715" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">Separate forecast quality</text><text x="1147" y="745" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">from execution authority</text><path fill="none" stroke="#686458" stroke-width="3" marker-end="url(#arrow)" d="M440 397H590"/><path fill="none" stroke="#686458" stroke-width="3" marker-end="url(#arrow)" d="M1160 397H1010"/><path fill="none" stroke="#686458" stroke-width="3" marker-end="url(#arrow)" d="M598 660C652 617 690 573 724 530"/><path fill="none" stroke="#686458" stroke-width="3" marker-end="url(#arrow)" d="M1002 660C948 617 910 573 876 530"/><text x="800" y="848" fill="#7b7568" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">Architecture sentence: human input -&gt; owner selection -&gt; specialist work -&gt; verification -&gt; visible state -&gt; next action</text></svg>