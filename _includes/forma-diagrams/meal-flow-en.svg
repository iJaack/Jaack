<svg class="forma-diagram__desktop" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="meal-en-d-title meal-en-d-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="meal-en-d-title">Logging a meal</title>
  <desc id="meal-en-d-desc">You send a photo, a menu or a description. Forma estimates calories, macros and fiber, marks the numbers as an estimate, writes them to the diary and the dashboard updates. If you correct the meal, it updates the same entry, without creating a second one.</desc>
  <defs>
    <marker id="meal-en-d-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="meal-en-d-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="meal-en-d-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="meal-en-d-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="80" fill="var(--jk-ink)" font-size="32" font-weight="600">Logging a meal</text>
  <rect x="64" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="188.0" y="287.59999999999997" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="188.0" dy="0">You send a photo,</tspan><tspan x="188.0" dy="30">a menu or a</tspan><tspan x="188.0" dy="30">description</tspan></text>
  <line x1="312" y1="308.0" x2="364" y2="308.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-d-arrow)"/>
  <rect x="368" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-accent)" stroke-width="3"/>
  <text x="492.0" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="492.0" dy="0">Forma estimates</tspan><tspan x="492.0" dy="30">kcal, macros</tspan><tspan x="492.0" dy="30">and fiber</tspan></text>
  <text x="492.0" y="357.0" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="492.0" dy="0">marked as estimate</tspan></text>
  <line x1="616" y1="308.0" x2="668" y2="308.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-d-arrow)"/>
  <rect x="672" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="796.0" y="317.59999999999997" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="796.0" dy="0">Writes to the diary</tspan></text>
  <line x1="920" y1="308.0" x2="972" y2="308.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-d-arrow)"/>
  <rect x="976" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="1100.0" y="302.59999999999997" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1100.0" dy="0">The dashboard</tspan><tspan x="1100.0" dy="30">updates</tspan></text>
  <line x1="1224" y1="308.0" x2="1276" y2="308.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-d-arrow)"/>
  <rect x="1280" y="168" width="248" height="280" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="1404.0" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1404.0" dy="0">If you correct it,</tspan><tspan x="1404.0" dy="30">it updates the</tspan><tspan x="1404.0" dy="30">same entry</tspan></text>
  <text x="1404.0" y="357.0" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1404.0" dy="0">no duplicate</tspan></text>
</svg>
