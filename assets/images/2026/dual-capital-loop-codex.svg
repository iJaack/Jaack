<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" aria-labelledby="title desc" role="img" viewBox="0 0 1600 920"><title id="title">Two hidden capital loops</title><desc id="desc">A light theme diagram showing the Predictie to Mony macro loop and the Wolfie to Mony protocol reality loop feeding treasury posture.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fbfaf6"/><stop offset="100%" stop-color="#f1eee5"/></linearGradient><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#666257" d="M0 0L10 5L0 10Z"/></marker></defs><rect width="1600" height="920" fill="url(#bg)"/><text x="120" y="118" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700">Two hidden capital loops</text><text x="120" y="163" fill="#625d53" font-family="Helvetica, Arial, sans-serif" font-size="24">Both loops end in treasury posture, but they start from different truths and need different skepticism.</text><rect width="1360" height="250" x="120" y="250" fill="#fff" stroke="#d8d3c7" stroke-width="2" rx="30"/><text x="170" y="315" fill="#3f7f73" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Loop 1</text><text x="170" y="353" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700">Predictie -&gt; Mony</text><text x="170" y="392" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Macro loop: forecast truth -&gt; treasury posture</text><rect width="230" height="120" x="170" y="420" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2" rx="22"/><text x="285" y="470" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Predictie</text><text x="285" y="503" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">probabilities + triggers</text><rect width="220" height="120" x="512" y="420" fill="#fff8ef" stroke="#e2b16f" stroke-width="2" rx="22"/><text x="622" y="470" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Policy gate</text><text x="622" y="503" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">freshness + approval</text><rect width="220" height="120" x="844" y="420" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2" rx="22"/><text x="954" y="470" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Mony</text><text x="954" y="503" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">posture, sizing, hedge</text><rect width="230" height="120" x="1176" y="420" fill="#fff3f1" stroke="#d78f83" stroke-width="2" rx="22"/><text x="1291" y="470" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Receipt</text><text x="1291" y="503" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">rebalance or no-op</text><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M400 480H512"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M732 480H844"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M1064 480H1176"/><rect width="1360" height="250" x="120" y="560" fill="#fff" stroke="#d8d3c7" stroke-width="2" rx="30"/><text x="170" y="625" fill="#8a4c42" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Loop 2</text><text x="170" y="663" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700">Wolfie -&gt; Mony</text><text x="170" y="702" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Protocol reality loop: ecosystem traction, governance progress, fee-capture reality -&gt; treasury posture</text><rect width="230" height="120" x="170" y="730" fill="#f6f4ff" stroke="#a295d6" stroke-width="2" rx="22"/><text x="285" y="780" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Wolfie</text><text x="285" y="813" fill="#675f88" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">protocol context + signal</text><rect width="220" height="120" x="512" y="730" fill="#fff8ef" stroke="#e2b16f" stroke-width="2" rx="22"/><text x="622" y="780" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Policy gate</text><text x="622" y="813" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">bias check + approval</text><rect width="220" height="120" x="844" y="730" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2" rx="22"/><text x="954" y="780" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Mony</text><text x="954" y="813" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">rotation, hedge, no-op</text><rect width="230" height="120" x="1176" y="730" fill="#fff3f1" stroke="#d78f83" stroke-width="2" rx="22"/><text x="1291" y="780" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Receipt</text><text x="1291" y="813" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">recorded capital posture</text><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M400 790H512"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M732 790H844"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M1064 790H1176"/></svg>