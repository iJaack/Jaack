<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" aria-labelledby="setup-en-d-title setup-en-d-desc" class="forma-diagram__desktop" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 1600 520"><title id="setup-en-d-title">Setting up Forma</title><desc id="setup-en-d-desc">The six steps: install the bot template, go through the first conversation (ten questions), deploy the dashboard on Cloudflare, build Forma Sync in Xcode, connect with INGEST_SECRET, do the first sync.</desc><defs><marker id="setup-en-d-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="setup-en-d-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="setup-en-d-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="setup-en-d-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="80" fill="var(--jk-ink)" font-size="32" font-weight="600">Setting up Forma</text><line x1="128" x2="1408" y1="260" y2="260" stroke="var(--jk-hair)" stroke-width="2"/><circle cx="128" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="128" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">1</text><text x="128" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="128" dy="0">Install the</tspan><tspan x="128" dy="32">bot template</tspan></text><circle cx="384" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="384" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">2</text><text x="384" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="384" dy="0">First conversation</tspan><tspan x="384" dy="32">(10 questions)</tspan></text><circle cx="640" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="640" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">3</text><text x="640" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="640" dy="0">Deploy the</tspan><tspan x="640" dy="32">dashboard on</tspan><tspan x="640" dy="32">Cloudflare</tspan></text><circle cx="896" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="896" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">4</text><text x="896" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="896" dy="0">Build Forma Sync</tspan><tspan x="896" dy="32">in Xcode</tspan></text><circle cx="1152" cy="260" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="1152" y="268" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle">5</text><text x="1152" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1152" dy="0">Connect with</tspan><tspan x="1152" dy="32">INGEST_SECRET</tspan></text><circle cx="1408" cy="260" r="24" fill="none" stroke="var(--jk-accent)" stroke-width="3"/><text x="1408" y="268" fill="var(--jk-accent)" font-size="24" font-weight="600" text-anchor="middle">6</text><text x="1408" y="324" fill="var(--jk-ink)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1408" dy="0">First sync</tspan></text></svg>