<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">Eva loop system cover</title><desc id="desc">Light theme cover diagram showing the routing, health, truth, and forecast loops around the Eva system core.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fbfaf6"/><stop offset="100%" stop-color="#f1efe8"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#171717" flood-opacity=".1" stdDeviation="18"/></filter><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#5c5952" d="M0 0L10 5L0 10Z"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="800" cy="450" r="298" fill="#fff" stroke="#d8d3c7" stroke-width="2"/><circle cx="800" cy="450" r="250" fill="none" stroke="#ece7dc" stroke-width="32"/><text x="140" y="170" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700">The loops that keep the system honest</text><text x="140" y="225" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="26">Routing chooses ownership. Health checks runtime. Truth protects the dashboard. Forecasts stop before authority leaks into execution.</text><rect width="366" height="232" x="617" y="333" fill="#fff" stroke="#d8d3c7" stroke-width="2" filter="url(#shadow)" rx="30"/><text x="800" y="395" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" text-anchor="middle">EVA</text><text x="800" y="433" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle">Kernel + governance</text><text x="800" y="480" fill="#3f7f73" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Routing</text><text x="800" y="514" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle">Owner selection and delegation</text><rect width="300" height="170" x="188" y="308" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2" rx="26"/><text x="338" y="367" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Routing loop</text><text x="338" y="406" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">Input -&gt; owner -&gt; specialist</text><text x="338" y="436" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">-&gt; verify -&gt; return</text><rect width="300" height="170" x="1112" y="308" fill="#fff8ef" stroke="#e2b16f" stroke-width="2" rx="26"/><text x="1262" y="367" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Health loop</text><text x="1262" y="406" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">Observe -&gt; classify -&gt; repair</text><text x="1262" y="436" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">-&gt; verify -&gt; update state</text><rect width="320" height="170" x="272" y="615" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2" rx="26"/><text x="432" y="674" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Truth loop</text><text x="432" y="713" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">Compare UI claims to runtime</text><text x="432" y="743" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">and degrade stale confidence</text><rect width="344" height="170" x="1008" y="615" fill="#fff3f1" stroke="#d78f83" stroke-width="2" rx="26"/><text x="1180" y="674" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Forecast loop</text><text x="1180" y="713" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">Forecast -&gt; decision -&gt; policy</text><text x="1180" y="743" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">-&gt; receipt -&gt; calibration</text><path fill="none" stroke="#5c5952" stroke-width="3" marker-end="url(#arrow)" d="M488 392C540 392 570 390 610 400"/><path fill="none" stroke="#5c5952" stroke-width="3" marker-end="url(#arrow)" d="M1112 392C1060 392 1030 390 990 400"/><path fill="none" stroke="#5c5952" stroke-width="3" marker-end="url(#arrow)" d="M592 660C645 625 678 595 715 558"/><path fill="none" stroke="#5c5952" stroke-width="3" marker-end="url(#arrow)" d="M1008 660C955 625 922 595 885 558"/><text x="140" y="822" fill="#7b7568" font-family="Helvetica, Arial, sans-serif" font-size="20">Light-theme system map for the article on routing, health, truth, and forecast-to-action loops.</text></svg>