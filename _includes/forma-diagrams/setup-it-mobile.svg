<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-labelledby="setup-it-m-title setup-it-m-desc" class="forma-diagram__mobile" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 800 1000"><title id="setup-it-m-title">Mettere in piedi Forma</title><desc id="setup-it-m-desc">I sei passi: installi il template del bot, fai la prima conversazione (dieci domande), metti in piedi la dashboard su Cloudflare, compili Forma Sync in Xcode, colleghi con INGEST_SECRET, fai la prima sincronizzazione.</desc><defs><marker id="setup-it-m-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="setup-it-m-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="setup-it-m-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="setup-it-m-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">Mettere in piedi Forma</text><line x1="112" x2="112" y1="200" y2="880" stroke="var(--jk-hair)" stroke-width="2"/><circle cx="112" cy="200" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="112" y="209" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="160" y="209" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Installi il</tspan><tspan x="160" dy="36">template del bot</tspan></text><circle cx="112" cy="336" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="112" y="345" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">2</text><text x="160" y="345" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Prima conversazione</tspan><tspan x="160" dy="36">(10 domande)</tspan></text><circle cx="112" cy="472" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="112" y="481" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">3</text><text x="160" y="481" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Metti in piedi la</tspan><tspan x="160" dy="36">dashboard su</tspan><tspan x="160" dy="36">Cloudflare</tspan></text><circle cx="112" cy="608" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="112" y="617" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">4</text><text x="160" y="617" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Compili Forma Sync</tspan><tspan x="160" dy="36">in Xcode</tspan></text><circle cx="112" cy="744" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/><text x="112" y="753" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">5</text><text x="160" y="753" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Colleghi con</tspan><tspan x="160" dy="36">INGEST_SECRET</tspan></text><circle cx="112" cy="880" r="24" fill="none" stroke="var(--jk-accent)" stroke-width="3"/><text x="112" y="889" fill="var(--jk-accent)" font-size="28" font-weight="600" text-anchor="middle">6</text><text x="160" y="889" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Prima</tspan><tspan x="160" dy="36">sincronizzazione</tspan></text></svg>