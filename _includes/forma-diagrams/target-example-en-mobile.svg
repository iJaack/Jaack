<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-labelledby="tgt-en-m-title tgt-en-m-desc" class="forma-diagram__mobile" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 800 1000"><title id="tgt-en-m-title">An example day, 2,400 kcal</title><desc id="tgt-en-m-desc">A synthetic example: 2,400 kcal from Apple Health energy expenditure, split into 150 g of protein (600 kcal, you set this), fat at 25% (67 g, 600 kcal, within the 25-30% range) and carbs for the remainder (300 g, 1,200 kcal). Fiber is a separate 30 g target. This is not advice, and these are not real targets.</desc><defs><marker id="tgt-en-m-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="tgt-en-m-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="tgt-en-m-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="tgt-en-m-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">An example day, 2,400 kcal</text><rect width="153" height="48" x="64" y="136" fill="none" stroke="var(--jk-accent)" stroke-width="3" rx="12" ry="12"/><text x="140.5" y="169.8" fill="var(--jk-accent)" font-size="28" font-weight="600" text-anchor="middle">EXAMPLE</text><text x="64" y="232" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="start"><tspan x="64" dy="0">2,400 kcal</tspan></text><text x="64" y="268" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Apple Health energy expenditure</tspan></text><rect width="672" height="152" x="64" y="312" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><clipPath id="tgt-en-m-sw0"><rect width="80" height="96" x="80" y="340" rx="8" ry="8"/></clipPath><g clip-path="url(#tgt-en-m-sw0)"><rect width="80" height="96" x="80" y="340" fill="var(--jk-accent)"/><rect width="80" height="96" x="80" y="340" fill="none" stroke="var(--jk-hair-2)" stroke-width="2"/></g><text x="184" y="376" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="start"><tspan x="184" dy="0">Protein, 150 g</tspan></text><text x="184" y="416" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start"><tspan x="184" dy="0">600 kcal · you set this</tspan></text><rect width="672" height="152" x="64" y="480" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><clipPath id="tgt-en-m-sw1"><rect width="80" height="96" x="80" y="508" rx="8" ry="8"/></clipPath><g clip-path="url(#tgt-en-m-sw1)"><rect width="80" height="96" x="80" y="508" fill="url(#tgt-en-m-hatch-acc)"/><rect width="80" height="96" x="80" y="508" fill="none" stroke="var(--jk-hair-2)" stroke-width="2"/></g><text x="184" y="544" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="start"><tspan x="184" dy="0">Fat, 67 g</tspan></text><text x="184" y="584" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start"><tspan x="184" dy="0">600 kcal · 25%, within 25-30%</tspan></text><rect width="672" height="152" x="64" y="648" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><clipPath id="tgt-en-m-sw2"><rect width="80" height="96" x="80" y="676" rx="8" ry="8"/></clipPath><g clip-path="url(#tgt-en-m-sw2)"><rect width="80" height="96" x="80" y="676" fill="none" stroke="var(--jk-hair-2)" stroke-width="2"/></g><text x="184" y="712" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="start"><tspan x="184" dy="0">Carbs, 300 g</tspan></text><text x="184" y="752" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start"><tspan x="184" dy="0">1,200 kcal · the remainder</tspan></text><rect width="672" height="96" x="64" y="840" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="400" y="880" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">Fiber: 30 g,</tspan><tspan x="400" dy="36">a separate target, not a slice of the calories</tspan></text></svg>