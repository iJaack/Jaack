<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" aria-labelledby="meal-en-d-title meal-en-d-desc" class="forma-diagram__desktop" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 1600 560"><title id="meal-en-d-title">Logging a meal</title><desc id="meal-en-d-desc">You send a photo, a menu or a description. Forma estimates calories, macros and fiber, marks the numbers as an estimate, writes them to the diary and the dashboard updates. If you correct the meal, it updates the same entry, without creating a second one.</desc><defs><marker id="meal-en-d-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="meal-en-d-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="meal-en-d-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="meal-en-d-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="80" fill="var(--jk-ink)" font-size="32" font-weight="600">Logging a meal</text><rect width="248" height="280" x="64" y="168" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="188" y="287.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="188" dy="0">You send a photo,</tspan><tspan x="188" dy="30">a menu or a</tspan><tspan x="188" dy="30">description</tspan></text><line x1="312" x2="364" y1="308" y2="308" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-d-arrow)"/><rect width="248" height="280" x="368" y="168" fill="none" stroke="var(--jk-accent)" stroke-width="3" rx="12" ry="12"/><text x="492" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="492" dy="0">Forma estimates</tspan><tspan x="492" dy="30">kcal, macros</tspan><tspan x="492" dy="30">and fiber</tspan></text><text x="492" y="357" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="492" dy="0">marked as estimate</tspan></text><line x1="616" x2="668" y1="308" y2="308" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-d-arrow)"/><rect width="248" height="280" x="672" y="168" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="796" y="317.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="796" dy="0">Writes to the diary</tspan></text><line x1="920" x2="972" y1="308" y2="308" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-d-arrow)"/><rect width="248" height="280" x="976" y="168" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="1100" y="302.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1100" dy="0">The dashboard</tspan><tspan x="1100" dy="30">updates</tspan></text><line x1="1224" x2="1276" y1="308" y2="308" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-d-arrow)"/><rect width="248" height="280" x="1280" y="168" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="1404" y="268.6" fill="var(--jk-ink)" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1404" dy="0">If you correct it,</tspan><tspan x="1404" dy="30">it updates the</tspan><tspan x="1404" dy="30">same entry</tspan></text><text x="1404" y="357" fill="var(--jk-ink-2)" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1404" dy="0">no duplicate</tspan></text></svg>