{% assign pv_id = include.id %}
{% assign pv_path = '/assets/images/work/' | append: pv_id | append: '/' | append: pv_id | append: '-site-' | relative_url %}
<figure class="project-video" data-pv>
  <div class="pv-stage">
    <video id="pv-video-{{ pv_id }}" class="pv-media" muted loop playsinline disablepictureinpicture preload="none" aria-describedby="pv-desc-{{ pv_id }}" aria-labelledby="pv-caption-{{ pv_id }}" poster="{{ pv_path }}compact-poster.webp" width="358" height="770">
      <source media="(min-width: 776px)" src="{{ pv_path }}wide.webm" type="video/webm">
      <source media="(min-width: 776px)" src="{{ pv_path }}wide.mp4" type="video/mp4">
      <source src="{{ pv_path }}compact.webm" type="video/webm">
      <source src="{{ pv_path }}compact.mp4" type="video/mp4">
    </video>
    <picture class="pv-poster">
      <source media="(min-width: 776px)" srcset="{{ pv_path }}wide-poster.webp" type="image/webp" width="720" height="820">
      <source media="(min-width: 776px)" srcset="{{ pv_path }}wide-poster.png" type="image/png" width="720" height="820">
      <source srcset="{{ pv_path }}compact-poster.webp" type="image/webp">
      <img src="{{ pv_path }}compact-poster.png" width="358" height="770" alt="" loading="eager" decoding="async" fetchpriority="high">
    </picture>
  </div>
  <div class="pv-bar">
    <figcaption id="pv-caption-{{ pv_id }}"><span class="lang-en" lang="en">Carta's Publish sheet on iPhone. Sample text.</span><span class="lang-it" lang="it">Il foglio Pubblica di Carta su iPhone. Testi di esempio.</span></figcaption>
    <button class="pv-toggle" type="button" hidden aria-controls="pv-video-{{ pv_id }}" aria-label="Metti in pausa il video">
      <!-- Filled Lucide Play / Pause geometry, MIT license: https://lucide.dev/license -->
      <svg class="pv-ic pv-ic--pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg>
      <svg class="pv-ic pv-ic--play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg>
    </button>
  </div>
  <p id="pv-desc-{{ pv_id }}" class="visually-hidden"><span class="lang-en" lang="en">Carta on iPhone: from a draft, Publish opens; the third post is 29 characters over X's limit and “Dividi qui” (Split here) splits it in two. The thread goes from 4 to 5 posts, all within 280 characters.</span><span class="lang-it" lang="it">Carta su iPhone: dalla bozza si apre Pubblica; il terzo post supera di 29 caratteri il limite di X e "Dividi qui" lo divide in due. Il thread passa da 4 a 5 post, tutti entro i 280 caratteri.</span></p>
</figure>
<script src="{{ '/assets/js/project-video.js' | relative_url }}" defer></script>
