<svg class="forma-diagram__mobile" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="meal-en-m-title meal-en-m-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="meal-en-m-title">Logging a meal</title>
  <desc id="meal-en-m-desc">You send a photo, a menu or a description. Forma estimates calories, macros and fiber, marks the numbers as an estimate, writes them to the diary and the dashboard updates. If you correct the meal, it updates the same entry, without creating a second one.</desc>
  <defs>
    <marker id="meal-en-m-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="meal-en-m-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="meal-en-m-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="meal-en-m-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">Logging a meal</text>
  <rect x="64" y="136" width="672" height="124" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="400.0" y="174.20000000000002" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400.0" dy="0">You send a photo,</tspan><tspan x="400.0" dy="35">a menu or a</tspan><tspan x="400.0" dy="35">description</tspan></text>
  <rect x="64" y="297" width="672" height="167" rx="12" ry="12" fill="none" stroke="var(--jk-accent)" stroke-width="3"/>
  <text x="400.0" y="335.2" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400.0" dy="0">Forma estimates</tspan><tspan x="400.0" dy="35">kcal, macros</tspan><tspan x="400.0" dy="35">and fiber</tspan></text>
  <text x="400.0" y="437.0" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400.0" dy="0">marked as estimate</tspan></text>
  <rect x="64" y="501" width="672" height="112" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="400.0" y="568.1999999999999" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400.0" dy="0">Writes to the diary</tspan></text>
  <rect x="64" y="650" width="672" height="112" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="400.0" y="699.6999999999999" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400.0" dy="0">The dashboard</tspan><tspan x="400.0" dy="35">updates</tspan></text>
  <rect x="64" y="799" width="672" height="167" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="400.0" y="837.1999999999999" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400.0" dy="0">If you correct it,</tspan><tspan x="400.0" dy="35">it updates the</tspan><tspan x="400.0" dy="35">same entry</tspan></text>
  <text x="400.0" y="938.9999999999999" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400.0" dy="0">no duplicate</tspan></text>
  <line x1="400" y1="260" x2="400" y2="293" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-m-arrow)"/>
  <line x1="400" y1="464" x2="400" y2="497" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-m-arrow)"/>
  <line x1="400" y1="613" x2="400" y2="646" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-m-arrow)"/>
  <line x1="400" y1="762" x2="400" y2="795" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#meal-en-m-arrow)"/>
</svg>
