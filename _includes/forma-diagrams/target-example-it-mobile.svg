<svg class="forma-diagram__mobile" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="tgt-it-m-title tgt-it-m-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="tgt-it-m-title">Un giorno d'esempio, 2.400 kcal</title>
  <desc id="tgt-it-m-desc">Esempio sintetico: 2.400 kcal dalla spesa energetica di Apple Health, suddivise in 150 g di proteine (600 kcal, le imposti tu), grassi al 25% (67 g, 600 kcal, dentro il 25-30%) e carboidrati per il resto (300 g, 1.200 kcal). Le fibre sono un target a parte, 30 g. Non è un consiglio e non sono target reali.</desc>
  <defs>
    <marker id="tgt-it-m-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="tgt-it-m-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="tgt-it-m-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="tgt-it-m-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">Un giorno d'esempio, 2.400 kcal</text>
  <rect x="64" y="136" width="153" height="48" rx="12" ry="12" fill="none" stroke="var(--jk-accent)" stroke-width="3"/>
  <text x="140.5" y="169.8" fill="var(--jk-accent)" font-size="28" font-weight="600" text-anchor="middle">ESEMPIO</text>
  <text x="64" y="232" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="start"><tspan x="64" dy="0">2.400 kcal</tspan></text>
  <text x="64" y="268" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start"><tspan x="64" dy="0">spesa energetica di Apple Health</tspan></text>
  <rect x="64" y="312" width="672" height="152" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <clipPath id="tgt-it-m-sw0"><rect x="80" y="340" width="80" height="96" rx="8" ry="8"/></clipPath>
  <g clip-path="url(#tgt-it-m-sw0)">
    <rect x="80" y="340" width="80" height="96" fill="var(--jk-accent)"/>
    <rect x="80" y="340" width="80" height="96" fill="none" stroke="var(--jk-hair-2)" stroke-width="2"/>
  </g>
  <text x="184" y="376" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="start"><tspan x="184" dy="0">Proteine, 150 g</tspan></text>
  <text x="184" y="416" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start"><tspan x="184" dy="0">600 kcal · le imposti tu</tspan></text>
  <rect x="64" y="480" width="672" height="152" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <clipPath id="tgt-it-m-sw1"><rect x="80" y="508" width="80" height="96" rx="8" ry="8"/></clipPath>
  <g clip-path="url(#tgt-it-m-sw1)">
    <rect x="80" y="508" width="80" height="96" fill="url(#tgt-it-m-hatch-acc)"/>
    <rect x="80" y="508" width="80" height="96" fill="none" stroke="var(--jk-hair-2)" stroke-width="2"/>
  </g>
  <text x="184" y="544" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="start"><tspan x="184" dy="0">Grassi, 67 g</tspan></text>
  <text x="184" y="584" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start"><tspan x="184" dy="0">600 kcal · 25%, nel 25-30%</tspan></text>
  <rect x="64" y="648" width="672" height="152" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <clipPath id="tgt-it-m-sw2"><rect x="80" y="676" width="80" height="96" rx="8" ry="8"/></clipPath>
  <g clip-path="url(#tgt-it-m-sw2)">
    <rect x="80" y="676" width="80" height="96" fill="none" stroke="var(--jk-hair-2)" stroke-width="2"/>
  </g>
  <text x="184" y="712" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="start"><tspan x="184" dy="0">Carboidrati, 300 g</tspan></text>
  <text x="184" y="752" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start"><tspan x="184" dy="0">1.200 kcal · il resto</tspan></text>
  <rect x="64" y="840" width="672" height="96" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="400" y="880" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">Fibre: 30 g,</tspan><tspan x="400" dy="36">un target a parte, non una fetta delle calorie</tspan></text>
</svg>
