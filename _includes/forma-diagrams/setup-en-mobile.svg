<svg class="forma-diagram__mobile" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="setup-en-m-title setup-en-m-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="setup-en-m-title">Setting up Forma</title>
  <desc id="setup-en-m-desc">The six steps: install the bot template, go through the first conversation (ten questions), deploy the dashboard on Cloudflare, build Forma Sync in Xcode, connect with INGEST_SECRET, do the first sync.</desc>
  <defs>
    <marker id="setup-en-m-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="setup-en-m-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="setup-en-m-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="setup-en-m-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">Setting up Forma</text>
  <line x1="112" y1="200" x2="112" y2="880" stroke="var(--jk-hair)" stroke-width="2"/>
  <circle cx="112" cy="200" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="112" y="209" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">1</text>
  <text x="160" y="209" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Install the</tspan><tspan x="160" dy="36">bot template</tspan></text>
  <circle cx="112" cy="336" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="112" y="345" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">2</text>
  <text x="160" y="345" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">First conversation</tspan><tspan x="160" dy="36">(10 questions)</tspan></text>
  <circle cx="112" cy="472" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="112" y="481" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">3</text>
  <text x="160" y="481" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Deploy the</tspan><tspan x="160" dy="36">dashboard on</tspan><tspan x="160" dy="36">Cloudflare</tspan></text>
  <circle cx="112" cy="608" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="112" y="617" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">4</text>
  <text x="160" y="617" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Build Forma Sync</tspan><tspan x="160" dy="36">in Xcode</tspan></text>
  <circle cx="112" cy="744" r="24" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="112" y="753" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle">5</text>
  <text x="160" y="753" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">Connect with</tspan><tspan x="160" dy="36">INGEST_SECRET</tspan></text>
  <circle cx="112" cy="880" r="24" fill="none" stroke="var(--jk-accent)" stroke-width="3"/>
  <text x="112" y="889" fill="var(--jk-accent)" font-size="28" font-weight="600" text-anchor="middle">6</text>
  <text x="160" y="889" fill="var(--jk-ink)" font-size="28" font-weight="400" text-anchor="start"><tspan x="160" dy="0">First sync</tspan></text>
</svg>
