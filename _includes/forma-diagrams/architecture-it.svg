  <line x1="320" y1="616.0" x2="364" y2="616.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-it-d-arrow)"/>
  <line x1="624" y1="616.0" x2="956" y2="616.0" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-it-d-arrow)"/>
