<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-labelledby="tgt-it-m-title tgt-it-m-desc" class="forma-diagram__mobile" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 800 1000"><title id="tgt-it-m-title">Un giorno d&apos;esempio, 2.400 kcal</title><desc id="tgt-it-m-desc">Esempio sintetico: 2.400 kcal dalla spesa energetica di Apple Health, suddivise in 150 g di proteine (600 kcal, le imposti tu), grassi al 25% (67 g, 600 kcal, dentro il 25-30%) e carboidrati per il resto (300 g, 1.200 kcal). Le fibre sono un target a parte, 30 g. Non è un consiglio e non sono target reali.</desc><defs><marker id="tgt-it-m-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="tgt-it-m-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="tgt-it-m-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="tgt-it-m-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">Un giorno d&apos;esempio, 2.400 kcal</text><rect width="153" height="48" x="64" y="136" fill="none" stroke="var(--jk-accent)" stroke-width="3" rx="12" ry="12"/><text x="140.5" y="169.8" fill="var(--jk-accent)" font-size="28" font-weight="600" text-anchor="middle">ESEMPIO</text><text x="64" y="232" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="start"><tspan x="64" dy="0">2.400 kcal</tspan></text><text x="64" y="268" fill="var(--jk-ink-2)" font-size="28" font-weight="400" 