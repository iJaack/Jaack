<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three loops around the agent system core</title>
  <desc id="desc">A light theme overview diagram showing Eva at the center with routing, health, truth, and forecast loops around it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#f0ede4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#686458"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="110" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700">Three loops around the agent system core</text>
  <text x="800" y="154" text-anchor="middle" fill="#625d53" font-family="Helvetica, Arial, sans-serif" font-size="24">A small governance layer keeps ownership, runtime health, and visible truth aligned.</text>

  <rect x="610" y="280" width="380" height="250" rx="30" fill="#ffffff" stroke="#d8d3c7" stroke-width="2"/>
  <text x="800" y="354" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700">EVA</text>
  <text x="800" y="393" text-anchor="middle" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="24">Kernel</text>
  <text x="800" y="441" text-anchor="middle" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Ops = control plane</text>
  <text x="800" y="475" text-anchor="middle" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Mission Control = UI</text>

  <rect x="150" y="312" width="290" height="170" rx="24" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2"/>
  <text x="295" y="370" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Routing</text>
  <text x="295" y="407" text-anchor="middle" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="20">Choose the correct owner</text>
  <text x="295" y="437" text-anchor="middle" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="20">before work begins</text>

  <rect x="1160" y="312" width="290" height="170" rx="24" fill="#fff8ef" stroke="#e2b16f" stroke-width="2"/>
  <text x="1305" y="370" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Health</text>
  <text x="1305" y="407" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="20">Check runtime, listeners,</text>
  <text x="1305" y="437" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="20">delivery paths, and logs</text>

  <rect x="308" y="620" width="290" height="170" rx="24" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2"/>
  <text x="453" y="678" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Truth</text>
  <text x="453" y="715" text-anchor="middle" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="20">Refuse painted dashboards</text>
  <text x="453" y="745" text-anchor="middle" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="20">and stale green states</text>

  <rect x="1002" y="620" width="290" height="170" rx="24" fill="#fff3f1" stroke="#d78f83" stroke-width="2"/>
  <text x="1147" y="678" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Forecast</text>
  <text x="1147" y="715" text-anchor="middle" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="20">Separate forecast quality</text>
  <text x="1147" y="745" text-anchor="middle" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="20">from execution authority</text>

  <path d="M440 397H590" fill="none" stroke="#686458" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1160 397H1010" fill="none" stroke="#686458" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M598 660C652 617 690 573 724 530" fill="none" stroke="#686458" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1002 660C948 617 910 573 876 530" fill="none" stroke="#686458" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="800" y="848" text-anchor="middle" fill="#7b7568" font-family="Helvetica, Arial, sans-serif" font-size="20">Architecture sentence: human input -> owner selection -> specialist work -> verification -> visible state -> next action</text>
</svg>
