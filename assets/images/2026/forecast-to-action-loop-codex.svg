<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Forecast-to-action loop</title>
  <desc id="desc">A light theme process diagram showing forecast artifacts turning into decisions only after policy gates, receipts, and calibration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#f2eee5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#666257"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="120" y="118" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700">Forecast-to-action loop</text>
  <text x="120" y="163" fill="#625d53" font-family="Helvetica, Arial, sans-serif" font-size="24">Manual-first contract between Predictie and Mony. Forecast quality never becomes execution authority by accident.</text>

  <rect x="116" y="274" width="230" height="142" rx="24" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2"/>
  <text x="231" y="330" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Forecast artifact</text>
  <text x="231" y="365" text-anchor="middle" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18">probability, horizon,</text>
  <text x="231" y="392" text-anchor="middle" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18">triggers, invalidation</text>

  <rect x="402" y="274" width="230" height="142" rx="24" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2"/>
  <text x="517" y="330" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Decision artifact</text>
  <text x="517" y="365" text-anchor="middle" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="18">hold, rebalance, hedge,</text>
  <text x="517" y="392" text-anchor="middle" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="18">reduce risk, ask approval</text>

  <rect x="688" y="250" width="224" height="190" rx="28" fill="#fff8ef" stroke="#e2b16f" stroke-width="2"/>
  <text x="800" y="315" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Policy gate</text>
  <text x="800" y="354" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18">fresh sources</text>
  <text x="800" y="381" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18">risk check</text>
  <text x="800" y="408" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18">approval when required</text>

  <rect x="968" y="274" width="230" height="142" rx="24" fill="#fff3f1" stroke="#d78f83" stroke-width="2"/>
  <text x="1083" y="330" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Receipt</text>
  <text x="1083" y="365" text-anchor="middle" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="18">execution or no-op</text>
  <text x="1083" y="392" text-anchor="middle" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="18">with reason and timestamp</text>

  <rect x="1254" y="274" width="230" height="142" rx="24" fill="#f6f4ff" stroke="#a295d6" stroke-width="2"/>
  <text x="1369" y="330" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Calibration</text>
  <text x="1369" y="365" text-anchor="middle" fill="#675f88" font-family="Helvetica, Arial, sans-serif" font-size="18">track outcome quality</text>
  <text x="1369" y="392" text-anchor="middle" fill="#675f88" font-family="Helvetica, Arial, sans-serif" font-size="18">and next review trigger</text>

  <path d="M346 345H402" fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M632 345H688" fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M912 345H968" fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1198 345H1254" fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="120" y="520" width="1364" height="236" rx="28" fill="#ffffff" stroke="#d8d3c7" stroke-width="2"/>
  <text x="170" y="582" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Guardrails</text>
  <text x="170" y="633" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Predictie can produce forecasts, probabilities, triggers, and invalidation conditions.</text>
  <text x="170" y="674" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Mony can translate those forecasts into posture, but cannot invent or bypass forecast truth.</text>
  <text x="170" y="715" fill="#8a4c42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">No forecast freshness, no risk check, or no approval means the loop does not move.</text>
</svg>
