<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-labelledby="res-en-m-title res-en-m-desc" class="forma-diagram__mobile" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 800 1000"><title id="res-en-m-title">Free Apple ID, every 7 days</title><desc id="res-en-m-desc">With a free Apple ID the development profile expires after 7 days. The app stops opening and no longer syncs, until you reconnect the iPhone and press Run in Xcode again, with the same team and the same bundle ID.</desc><defs><marker id="res-en-m-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="res-en-m-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="res-en-m-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="res-en-m-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">Free Apple ID, every 7 days</text><rect width="672" height="120" x="64" y="152" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="400" y="205.7" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">You build</tspan><tspan x="400" dy="35">and install</tspan></text><line x1="200" x2="200" y1="272" y2="720" stroke="var(--jk-hair)" stroke-width="2"/><line x1="176" x2="224" y1="336" y2="336" stroke="var(--jk-ink)" stroke-width="2"/><text x="248" y="346" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 1</text><line x1="176" x2="224" y1="400" y2="400" stroke="var(--jk-ink)" stroke-width="2"/><text x="248" y="410" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 2</text><line x1="176" x2="224" y1="464" y2="464" stroke="var(--jk-ink)" stroke-width="2"/><text x="248" y="474" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 3</text><line x1="176" x2="224" y1="528" y2="528" stroke="var(--jk-ink)" stroke-width="2"/><text x="248" y="538" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 4</text><line x1="176" x2="224" y1="592" y2="592" stroke="var(--jk-ink)" stroke-width="2"/><text x="248" y="602" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 5</text><line x1="176" x2="224" y1="656" y2="656" stroke="var(--jk-ink)" stroke-width="2"/><text x="248" y="666" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 6</text><line x1="176" x2="224" y1="720" y2="720" stroke="var(--jk-accent)" stroke-width="3"/><text x="248" y="730" fill="var(--jk-accent)" font-size="28" font-weight="600" text-anchor="start">Day 7, expires</text><line x1="200" x2="200" y1="720" y2="808" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#res-en-m-arrow)"/><rect width="672" height="120" x="64" y="816" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="400" y="848.2" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">Reconnect the iPhone</tspan><tspan x="400" dy="35">and press ▶</tspan></text><text x="400" y="915" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">Same team and same bundle ID</tspan></text></svg>