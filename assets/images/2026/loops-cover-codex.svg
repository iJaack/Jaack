<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Eva loop system cover</title>
  <desc id="desc">Light theme cover diagram showing the routing, health, truth, and forecast loops around the Eva system core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#f1efe8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#171717" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5c5952"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="298" fill="#ffffff" stroke="#d8d3c7" stroke-width="2"/>
  <circle cx="800" cy="450" r="250" fill="none" stroke="#ece7dc" stroke-width="32"/>

  <text x="140" y="170" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700">The loops that keep the system honest</text>
  <text x="140" y="225" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="26">Routing chooses ownership. Health checks runtime. Truth protects the dashboard. Forecasts stop before authority leaks into execution.</text>

  <rect x="617" y="333" width="366" height="232" rx="30" fill="#ffffff" stroke="#d8d3c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="395" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700">EVA</text>
  <text x="800" y="433" text-anchor="middle" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="24">Kernel + governance</text>
  <text x="800" y="480" text-anchor="middle" fill="#3f7f73" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Routing</text>
  <text x="800" y="514" text-anchor="middle" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Owner selection and delegation</text>

  <rect x="188" y="308" width="300" height="170" rx="26" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2"/>
  <text x="338" y="367" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Routing loop</text>
  <text x="338" y="406" text-anchor="middle" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="21">Input -> owner -> specialist</text>
  <text x="338" y="436" text-anchor="middle" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="21">-> verify -> return</text>

  <rect x="1112" y="308" width="300" height="170" rx="26" fill="#fff8ef" stroke="#e2b16f" stroke-width="2"/>
  <text x="1262" y="367" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Health loop</text>
  <text x="1262" y="406" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="21">Observe -> classify -> repair</text>
  <text x="1262" y="436" text-anchor="middle" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="21">-> verify -> update state</text>

  <rect x="272" y="615" width="320" height="170" rx="26" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2"/>
  <text x="432" y="674" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Truth loop</text>
  <text x="432" y="713" text-anchor="middle" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="21">Compare UI claims to runtime</text>
  <text x="432" y="743" text-anchor="middle" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="21">and degrade stale confidence</text>

  <rect x="1008" y="615" width="344" height="170" rx="26" fill="#fff3f1" stroke="#d78f83" stroke-width="2"/>
  <text x="1180" y="674" text-anchor="middle" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Forecast loop</text>
  <text x="1180" y="713" text-anchor="middle" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="21">Forecast -> decision -> policy</text>
  <text x="1180" y="743" text-anchor="middle" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="21">-> receipt -> calibration</text>

  <path d="M488 392C540 392 570 390 610 400" fill="none" stroke="#5c5952" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1112 392C1060 392 1030 390 990 400" fill="none" stroke="#5c5952" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M592 660C645 625 678 595 715 558" fill="none" stroke="#5c5952" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1008 660C955 625 922 595 885 558" fill="none" stroke="#5c5952" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="140" y="822" fill="#7b7568" font-family="Helvetica, Arial, sans-serif" font-size="20">Light-theme system map for the article on routing, health, truth, and forecast-to-action loops.</text>
</svg>
