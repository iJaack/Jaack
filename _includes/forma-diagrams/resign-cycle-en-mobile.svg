<svg class="forma-diagram__mobile" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="res-en-m-title res-en-m-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="res-en-m-title">Free Apple ID, every 7 days</title>
  <desc id="res-en-m-desc">With a free Apple ID the development profile expires after 7 days. The app stops opening and no longer syncs, until you reconnect the iPhone and press Run in Xcode again, with the same team and the same bundle ID.</desc>
  <defs>
    <marker id="res-en-m-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="res-en-m-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="res-en-m-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="res-en-m-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">Free Apple ID, every 7 days</text>
  <rect x="64" y="152" width="672" height="120" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="400.0" y="223.20000000000002" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400.0" dy="0">You build and install</tspan></text>
  <line x1="200" y1="272" x2="200" y2="720" stroke="var(--jk-hair)" stroke-width="2"/>
  <line x1="176" y1="336.0" x2="224" y2="336.0" stroke="var(--jk-ink)" stroke-width="2"/>
  <text x="248" y="346.0" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 1</text>
  <line x1="176" y1="400.0" x2="224" y2="400.0" stroke="var(--jk-ink)" stroke-width="2"/>
  <text x="248" y="410.0" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 2</text>
  <line x1="176" y1="464.0" x2="224" y2="464.0" stroke="var(--jk-ink)" stroke-width="2"/>
  <text x="248" y="474.0" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 3</text>
  <line x1="176" y1="528.0" x2="224" y2="528.0" stroke="var(--jk-ink)" stroke-width="2"/>
  <text x="248" y="538.0" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 4</text>
  <line x1="176" y1="592.0" x2="224" y2="592.0" stroke="var(--jk-ink)" stroke-width="2"/>
  <text x="248" y="602.0" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 5</text>
  <line x1="176" y1="656.0" x2="224" y2="656.0" stroke="var(--jk-ink)" stroke-width="2"/>
  <text x="248" y="666.0" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="start">Day 6</text>
  <line x1="176" y1="720.0" x2="224" y2="720.0" stroke="var(--jk-accent)" stroke-width="3"/>
  <text x="248" y="730.0" fill="var(--jk-accent)" font-size="28" font-weight="600" text-anchor="start">Day 7, expires</text>
  <line x1="200" y1="720" x2="200" y2="808" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#res-en-m-arrow)"/>
  <rect x="64" y="816" width="672" height="120" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="400.0" y="848.1999999999999" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400.0" dy="0">Reconnect the iPhone</tspan><tspan x="400.0" dy="35">and press ▶</tspan></text>
  <text x="400.0" y="914.9999999999999" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400.0" dy="0">Same team and same bundle ID</tspan></text>
</svg>
