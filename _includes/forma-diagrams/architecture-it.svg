<svg class="forma-diagram__desktop" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="arch-it-d-title arch-it-d-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="arch-it-d-title">Come arrivano i dati</title>
  <desc id="arch-it-d-desc">Tu parli con il bot Forma in Grok Bot, che invia i pasti a un Worker Cloudflare con D1. Forma Sync invia i dati di Apple Health allo stesso Worker. La dashboard, protetta da password, li legge da lì. Calendario ed email, se collegati, arrivano al bot in sola lettura.</desc>
