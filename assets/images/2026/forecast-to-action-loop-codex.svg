<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">Forecast-to-action loop</title><desc id="desc">A light theme process diagram showing forecast artifacts turning into decisions only after policy gates, receipts, and calibration.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fbfaf6"/><stop offset="100%" stop-color="#f2eee5"/></linearGradient><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#666257" d="M0 0L10 5L0 10Z"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="120" y="118" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700">Forecast-to-action loop</text><text x="120" y="163" fill="#625d53" font-family="Helvetica, Arial, sans-serif" font-size="24">Manual-first contract between Predictie and Mony. Forecast quality never becomes execution authority by accident.</text><rect width="230" height="142" x="116" y="274" fill="#f3f7ff" stroke="#7ea3dd" stroke-width="2" rx="24"/><text x="231" y="330" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Forecast artifact</text><text x="231" y="365" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">probability, horizon,</text><text x="231" y="392" fill="#4f6482" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">triggers, invalidation</text><rect width="230" height="142" x="402" y="274" fill="#f0fbf7" stroke="#7ab9ab" stroke-width="2" rx="24"/><text x="517" y="330" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Decision artifact</text><text x="517" y="365" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">hold, rebalance, hedge,</text><text x="517" y="392" fill="#47625d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">reduce risk, ask approval</text><rect width="224" height="190" x="688" y="250" fill="#fff8ef" stroke="#e2b16f" stroke-width="2" rx="28"/><text x="800" y="315" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Policy gate</text><text x="800" y="354" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">fresh sources</text><text x="800" y="381" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">risk check</text><text x="800" y="408" fill="#6d5a3d" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">approval when required</text><rect width="230" height="142" x="968" y="274" fill="#fff3f1" stroke="#d78f83" stroke-width="2" rx="24"/><text x="1083" y="330" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Receipt</text><text x="1083" y="365" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">execution or no-op</text><text x="1083" y="392" fill="#7a514a" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">with reason and timestamp</text><rect width="230" height="142" x="1254" y="274" fill="#f6f4ff" stroke="#a295d6" stroke-width="2" rx="24"/><text x="1369" y="330" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Calibration</text><text x="1369" y="365" fill="#675f88" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">track outcome quality</text><text x="1369" y="392" fill="#675f88" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">and next review trigger</text><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M346 345H402"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M632 345H688"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M912 345H968"/><path fill="none" stroke="#666257" stroke-width="3" marker-end="url(#arrow)" d="M1198 345H1254"/><rect width="1364" height="236" x="120" y="520" fill="#fff" stroke="#d8d3c7" stroke-width="2" rx="28"/><text x="170" y="582" fill="#1f1f1b" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Guardrails</text><text x="170" y="633" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Predictie can produce forecasts, probabilities, triggers, and invalidation conditions.</text><text x="170" y="674" fill="#5f5a50" font-family="Helvetica, Arial, sans-serif" font-size="22">Mony can translate those forecasts into posture, but cannot invent or bypass forecast truth.</text><text x="170" y="715" fill="#8a4c42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">No forecast freshness, no risk check, or no approval means the loop does not move.</text></svg>