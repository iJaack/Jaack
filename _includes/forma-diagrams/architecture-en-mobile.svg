<svg class="forma-diagram__mobile" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="arch-en-m-title arch-en-m-desc" xmlns="http://www.w3.org/2000/svg" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums">
  <title id="arch-en-m-title">How the data gets there</title>
  <desc id="arch-en-m-desc">You chat with the Forma bot in Grok Bot, which posts meals to a Cloudflare Worker with D1. Forma Sync posts Apple Health data to the same Worker. The password-protected dashboard reads from there. Calendar and email, if connected, reach the bot as read-only.</desc>
  <defs>
    <marker id="arch-en-m-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-ink)"/>
    </marker>
    <marker id="arch-en-m-arrow-acc" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,1 L14,7 L0,13 Z" fill="var(--jk-accent)"/>
    </marker>
    <pattern id="arch-en-m-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="var(--jk-ink)" stroke-width="1.5" stroke-opacity=".28"/>
    </pattern>
    <pattern id="arch-en-m-hatch-acc" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7" stroke="var(--jk-accent)" stroke-width="1.75"/>
    </pattern>
  </defs>
  <text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">How the data gets there</text>
  <rect x="64" y="152" width="312" height="120" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="220.0" y="184.20000000000002" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="220.0" dy="0">You, in chat</tspan></text>
  <text x="220.0" y="216.00000000000003" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="220.0" dy="0">photo, menu or text</tspan></text>
  <rect x="424" y="152" width="312" height="120" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="580.0" y="184.20000000000002" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="580.0" dy="0">iPhone</tspan><tspan x="580.0" dy="35">Apple Health</tspan></text>
  <text x="580.0" y="251.00000000000003" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="580.0" dy="0">Forma Sync</tspan></text>
  <rect x="64" y="328" width="312" height="176" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="220.0" y="370.7" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="220.0" dy="0">Forma bot</tspan></text>
  <text x="220.0" y="402.5" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="220.0" dy="0">in Grok Bot</tspan><tspan x="220.0" dy="35">calendar and email:</tspan><tspan x="220.0" dy="35">read-only</tspan></text>
  <rect x="64" y="556" width="672" height="236" rx="12" ry="12" fill="none" stroke="var(--jk-accent)" stroke-width="3"/>
  <text x="400.0" y="593.6999999999999" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400.0" dy="0">Cloudflare</tspan><tspan x="400.0" dy="35">Worker + D1</tspan></text>
  <text x="400.0" y="660.4999999999999" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400.0" dy="0">POST /api/ingest/meals</tspan><tspan x="400.0" dy="35">bearer</tspan><tspan x="400.0" dy="35">POST /api/ingest/health</tspan><tspan x="400.0" dy="35">bearer</tspan></text>
  <rect x="64" y="832" width="672" height="120" rx="12" ry="12" fill="none" stroke="var(--jk-hair)" stroke-width="2"/>
  <text x="400.0" y="881.6999999999999" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400.0" dy="0">Dashboard</tspan></text>
  <text x="400.0" y="913.4999999999999" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400.0" dy="0">password-protected</tspan></text>
  <line x1="220.0" y1="272" x2="220.0" y2="324" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-en-m-arrow)"/>
  <line x1="220.0" y1="504" x2="220.0" y2="552" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-en-m-arrow)"/>
  <line x1="580.0" y1="272" x2="580.0" y2="552" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-en-m-arrow)"/>
  <line x1="400" y1="792" x2="400" y2="828" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-en-m-arrow)"/>
</svg>
