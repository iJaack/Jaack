<li class="dated-row{% if post.star %} star{% endif %}">
  <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%b %Y' }} · {{ post.lang | upcase }}</time>
  <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  {% if post.tags contains 'research' %}<span class="row-meta">Research</span>{% endif %}
</li>
