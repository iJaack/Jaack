<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" aria-labelledby="arch-en-m-title arch-en-m-desc" class="forma-diagram__mobile" font-family="var(--jk-font, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif)" font-variant-numeric="tabular-nums" role="img" viewBox="0 0 800 1000"><title id="arch-en-m-title">How the data gets there</title><desc id="arch-en-m-desc">You chat with the Forma bot in Grok Bot, which posts meals to a Cloudflare Worker with D1. Forma Sync posts Apple Health data to the same Worker. The password-protected dashboard reads from there. Calendar and email, if connected, reach the bot as read-only.</desc><defs><marker id="arch-en-m-arrow" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-ink)" d="M0,1 L14,7 L0,13 Z"/></marker><marker id="arch-en-m-arrow-acc" markerHeight="14" markerWidth="14" orient="auto" refX="12" refY="7"><path fill="var(--jk-accent)" d="M0,1 L14,7 L0,13 Z"/></marker><pattern id="arch-en-m-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-ink)" stroke-opacity=".28" stroke-width="1.5" d="M0,8 L8,0"/></pattern><pattern id="arch-en-m-hatch-acc" width="8" height="8" patternUnits="userSpaceOnUse"><path stroke="var(--jk-accent)" stroke-width="1.75" d="M-1,1 L1,-1 M0,8 L8,0 M7,9 L9,7"/></pattern></defs><text x="64" y="108" fill="var(--jk-ink)" font-size="32" font-weight="600">How the data gets there</text><rect width="312" height="120" x="64" y="152" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="220" y="201.7" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="220" dy="0">You, in chat</tspan></text><text x="220" y="233.5" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="220" dy="0">photo, menu or text</tspan></text><rect width="312" height="120" x="424" y="152" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="580" y="184.2" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="580" dy="0">iPhone</tspan><tspan x="580" dy="35">Apple Health</tspan></text><text x="580" y="251" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="580" dy="0">Forma Sync</tspan></text><rect width="312" height="176" x="64" y="328" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="220" y="370.7" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="220" dy="0">Forma bot</tspan></text><text x="220" y="402.5" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="220" dy="0">in Grok Bot</tspan><tspan x="220" dy="35">calendar and email:</tspan><tspan x="220" dy="35">read-only</tspan></text><rect width="672" height="236" x="64" y="556" fill="none" stroke="var(--jk-accent)" stroke-width="3" rx="12" ry="12"/><text x="400" y="593.7" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">Cloudflare</tspan><tspan x="400" dy="35">Worker + D1</tspan></text><text x="400" y="660.5" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">POST /api/ingest/meals</tspan><tspan x="400" dy="35">bearer</tspan><tspan x="400" dy="35">POST /api/ingest/health</tspan><tspan x="400" dy="35">bearer</tspan></text><rect width="672" height="120" x="64" y="832" fill="none" stroke="var(--jk-hair)" stroke-width="2" rx="12" ry="12"/><text x="400" y="881.7" fill="var(--jk-ink)" font-size="28" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">Dashboard</tspan></text><text x="400" y="913.5" fill="var(--jk-ink-2)" font-size="28" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">password-protected</tspan></text><line x1="220" x2="220" y1="272" y2="324" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-en-m-arrow)"/><line x1="220" x2="220" y1="504" y2="552" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-en-m-arrow)"/><line x1="580" x2="580" y1="272" y2="552" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-en-m-arrow)"/><line x1="400" x2="400" y1="792" y2="828" stroke="var(--jk-ink)" stroke-width="2" marker-end="url(#arch-en-m-arrow)"/></svg>